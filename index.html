<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qwen3-VL 動画アノテーション</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="app-header">
      <h1 data-i18n="title">Qwen3-VL 動画アノテーション</h1>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="ja">日本語</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </header>

    <!-- 設定 -->
    <section class="panel" id="settings-panel">
      <div class="settings-row">
        <label>
          <span data-i18n="serverUrl">サーバーURL</span>
          <input type="text" id="server-url" value="http://localhost:8080">
        </label>
        <label>
          <span data-i18n="segmentInterval">セグメント間隔(秒)</span>
          <input type="number" id="segment-interval" value="3" min="1" max="30" step="1">
        </label>
      </div>
      <div class="settings-row">
        <label class="file-label">
          <span data-i18n="videoFile">動画ファイル</span>
          <!-- ブラウザ標準のボタン文言は変えられないため、input は視覚的に隠して独自表示にする -->
          <span class="file-picker">
            <input type="file" id="video-file" class="visually-hidden" accept="video/*">
            <span class="file-button" data-i18n="chooseFile">ファイルを選択</span>
            <span id="file-name" class="file-name">選択されていません</span>
          </span>
        </label>
        <button id="process-btn" data-i18n="process" disabled>処理開始</button>
        <button id="cancel-btn" data-i18n="cancel" hidden>キャンセル</button>
        <button id="export-btn" data-i18n="export" hidden>JSONダウンロード</button>
      </div>
      <!-- プロンプト設定(表示/非表示を切り替え) -->
      <div class="settings-row">
        <button id="toggle-prompt-btn" type="button" class="secondary">プロンプト設定を表示</button>
      </div>
      <div id="prompt-area" hidden>
        <label class="prompt-label">
          <span data-i18n="systemPrompt">システムプロンプト(モデルへの指示)</span>
          <textarea id="system-prompt" rows="5"></textarea>
        </label>
        <label class="prompt-label">
          <span data-i18n="userPrompt">ユーザープロンプト(各セグメントの画像に添える質問)</span>
          <textarea id="user-prompt" rows="2"></textarea>
        </label>
        <label class="prompt-label">
          <span data-i18n="ignoreWords">無視するワード(カンマ区切り。出力が一致したセグメントはタイムラインに追加しない)</span>
          <input type="text" id="ignore-words" data-i18n-placeholder="ignoreWordsPlaceholder" placeholder="例: その他, 何も行われていない">
        </label>
        <div class="settings-row">
          <button id="reset-prompt-btn" type="button" class="secondary" data-i18n="resetPrompt">既定に戻す</button>
        </div>
      </div>
      <!-- 進捗 -->
      <div id="progress-area" hidden>
        <progress id="progress-bar" value="0" max="100"></progress>
        <span id="progress-text"></span>
      </div>
      <div id="status-message" hidden></div>
    </section>

    <div id="content-area">
      <!-- プレイヤー -->
      <section class="panel" id="player-panel" hidden>
        <video id="player" controls playsinline></video>
        <!-- 現在のアノテーション -->
        <div id="current-annotation">
          <span id="current-annotation-text">&nbsp;</span>
        </div>
      </section>

      <!-- タイムライン(動画の右) -->
      <section class="panel" id="timeline-panel" hidden>
        <h2 data-i18n="timeline">タイムライン</h2>
        <!-- 絶対配置のリストを包むことで、リストの中身が枠の高さに影響しないようにする -->
        <div class="timeline-scroll">
          <ol id="timeline-list"></ol>
        </div>
      </section>
    </div>
  </main>

  <!-- フレーム抽出用(非表示) -->
  <video id="extract-video" muted playsinline hidden></video>

  <script src="app.js"></script>
</body>
</html>
